name: Update drought reports

on:
  schedule:
    # Runs daily; run_pipeline.py itself no-ops unless Climate Engine's
    # gridMET Drought dataset has actually published a new pentad since
    # our last successful run (checked live against Climate Engine's
    # /metadata/dataset_dates endpoint, not guessed from a day count --
    # see run_pipeline.py and DECISIONS.md "Data-driven cadence gate").
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no new pentad has been published since the last run"
        type: boolean
        default: false
      limit:
        description: "Cap features per layer (smoke test), blank = all"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Explicit timeout, with margin. GitHub silently caps job runtime at
    # 6 hours (360 min) regardless of what's set here -- a run that hit
    # this exact wall got "exceeded the maximum execution time of 6h0m0s"
    # even though timeout-minutes was 480. So 6 hours is a hard ceiling we
    # must fit under, not a value we can raise our way past.
    #
    # Root cause of long/failing runs (see DECISIONS.md "Water district
    # timeouts under concurrent load"): water district polygons are much
    # larger than groundwater/irrigation ones, and running many
    # concurrently badly degrades Earth Engine's per-job completion time.
    # Confirmed live: 15 concurrent -> ~50% of water districts timed out;
    # 3 concurrent -> 20/20 succeeded, 0 timeouts, ~1.6 min/polygon
    # average. run_pipeline.py now caps water_districts at 3 concurrent
    # (LAYER_MAX_IN_FLIGHT), which extrapolates to ~2.5-3 hours for all
    # 101 of them plus ~15 min for the other two layers -- comfortably
    # under the 6-hour ceiling. 240 min here is a safety margin over that
    # ~3 hour estimate, not the expected duration.
    timeout-minutes: 240
    outputs:
      site_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          CE_API_KEY: ${{ secrets.CE_API_KEY }}
          GW_ASSET_ID: ${{ secrets.GW_ASSET_ID }}
          IRR_ASSET_ID: ${{ secrets.IRR_ASSET_ID }}
          WD_ASSET_ID: ${{ secrets.WD_ASSET_ID }}
          # CE_USER_EMAIL intentionally not set here -- see fetch_reports.py docstring.
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python scripts/run_pipeline.py $ARGS

      # Debugging safety net: data/reports/raw/ (per-polygon status JSON,
      # including error messages) is never committed to git (see below),
      # so without this there is no way to diagnose a run after the fact --
      # e.g. a 2026-09-17 run that silently only completed ~78 of 350
      # irrigation orgs (a clean alphabetical cutoff, not scattered
      # failures) with no way to see why, since the job's own console log
      # isn't readable without repo admin auth. Kept only 5 days (one
      # cadence cycle) since it's for debugging, not an audit trail.
      - name: Upload raw status (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-status-${{ github.run_id }}
          path: data/reports/raw/
          retention-days: 5
          if-no-files-found: ignore

      # site/ is a pure build artifact (regenerated fresh every run from
      # data/reports/extracted, itself regenerated fresh from the API) and
      # deployed straight to Pages below -- never committed to git (333
      # polygons' worth of PNGs/CSVs is ~550MB; committing that every cycle
      # would balloon the repo by tens of GB/year). state.json (a few bytes,
      # the gridMET Drought data date this cycle covers) and
      # last_run_failures.json (which site names, if any, are missing from
      # this cycle after all retries -- see DECISIONS.md "Second retry
      # pass") are the two small files that ARE tracked, since otherwise
      # there's no way to see what failed without a GitHub token to pull the
      # raw-status artifact below.
      - id: diff
        run: |
          git add data/reports/state.json data/reports/last_run_failures.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebase onto the current remote main before pushing: this job can run
      # for ~2-3 hours (the full ~121-polygon fetch, chunked to stay under
      # the hourly quota -- see the timeout-minutes comment above), and main
      # may have moved in the meantime (a manual push, or a second triggered
      # run) -- without
      # this, git push fails outright with a non-fast-forward rejection, as
      # it did the first two times this workflow ran manually while the repo
      # was also being actively developed against. state.json and
      # last_run_failures.json are the only files this job ever touches, so
      # a conflict here would mean two concurrent report-fetch runs landed
      # at the same moment -- rare enough that failing loudly (rather than
      # silently resolving it) is the right behavior if it ever happens.
      - name: Commit state.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update drought reports $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Upload site artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
