name: Update drought reports

on:
  schedule:
    # Runs daily; run_pipeline.py itself no-ops unless >= 5 days have passed
    # since the last successful run (tracked in data/reports/state.json).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if fewer than 5 days have passed"
        type: boolean
        default: false
      limit:
        description: "Cap features per layer (smoke test), blank = all"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          CE_API_KEY: ${{ secrets.CE_API_KEY }}
          GW_ASSET_ID: ${{ secrets.GW_ASSET_ID }}
          IRR_ASSET_ID: ${{ secrets.IRR_ASSET_ID }}
          # CE_USER_EMAIL intentionally not set here -- see fetch_reports.py docstring.
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python scripts/run_pipeline.py $ARGS

      # site/ is a pure build artifact (regenerated fresh every run from
      # data/reports/extracted, itself regenerated fresh from the API) and
      # deployed straight to Pages below -- never committed to git (333
      # polygons' worth of PNGs/CSVs is ~550MB; committing that every 5 days
      # would balloon the repo by tens of GB/year). Only state.json, a few
      # bytes, is tracked -- it's what tells us the pipeline actually ran
      # this cycle (run_pipeline.py no-ops and leaves it untouched otherwise).
      - id: diff
        run: |
          git add data/reports/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebase onto the current remote main before pushing: this job can run
      # for ~50 minutes (the full 363-polygon fetch), and main may have moved
      # in the meantime (a manual push, or a second triggered run) -- without
      # this, git push fails outright with a non-fast-forward rejection, as
      # it did the first two times this workflow ran manually while the repo
      # was also being actively developed against. state.json is the only
      # file this job ever touches, so a conflict here would mean two
      # concurrent report-fetch runs landed at the same moment -- rare
      # enough that failing loudly (rather than silently resolving it) is
      # the right behavior if it ever happens.
      - name: Commit state.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update drought reports $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Upload site artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
