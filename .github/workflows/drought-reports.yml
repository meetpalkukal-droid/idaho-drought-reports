name: Update drought reports

on:
  schedule:
    # Runs daily; run_pipeline.py itself no-ops unless >= 5 days have passed
    # since the last successful run (tracked in data/reports/state.json).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if fewer than 5 days have passed"
        type: boolean
        default: false
      limit:
        description: "Cap features per layer (smoke test), blank = all"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          CE_API_KEY: ${{ secrets.CE_API_KEY }}
          CE_USER_EMAIL: ${{ secrets.CE_USER_EMAIL }}
          GW_ASSET_ID: ${{ secrets.GW_ASSET_ID }}
          IRR_ASSET_ID: ${{ secrets.IRR_ASSET_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python scripts/run_pipeline.py $ARGS

      - id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated reports and site
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update drought reports $(date -u +%Y-%m-%d)"
          git push

      - name: Upload site artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
